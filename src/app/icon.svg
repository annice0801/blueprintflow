<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blueprintflow 圖示：藍圖格線上的 A／B 雙棟立體大樓，底部節點連線代表流程 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2a52" />
      <stop offset="0.55" stop-color="#061631" />
      <stop offset="1" stop-color="#020814" />
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.5" />
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26" />
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.9" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.55" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect width="512" height="512" rx="116" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)" />
    <rect width="512" height="512" fill="url(#grid)" />
    <rect width="512" height="512" fill="url(#halo)" />
  </g>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#67e8f9" stroke-opacity="0.28" stroke-width="3" />

  <g transform="translate(-17 0)">
  <!-- A 棟（高） -->
  <g stroke="#67e8f9" stroke-width="7" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="250,118 292,96 292,370 250,392" fill="url(#side)" />
    <polygon points="148,118 250,118 250,392 148,392" fill="url(#front)" />
    <polygon points="148,118 190,96 292,96 250,118" fill="url(#top)" />
  </g>
  <g stroke="#a5f3fc" stroke-opacity="0.45" stroke-width="3">
    <path d="M160 160H238M160 200H238M160 240H238M160 280H238M160 320H238M160 360H238" />
    <path d="M199 130V380" stroke-opacity="0.25" />
  </g>

  <!-- B 棟（低，在前） -->
  <g stroke="#67e8f9" stroke-width="7" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="362,196 398,176 398,372 362,392" fill="url(#side)" />
    <polygon points="268,196 362,196 362,392 268,392" fill="url(#front)" />
    <polygon points="268,196 304,176 398,176 362,196" fill="url(#top)" />
  </g>
  <g stroke="#a5f3fc" stroke-opacity="0.45" stroke-width="3">
    <path d="M280 236H350M280 276H350M280 316H350M280 356H350" />
    <path d="M315 208V380" stroke-opacity="0.25" />
  </g>

  </g>

  <!-- 流程：地面基準線與節點 -->
  <g filter="url(#glow)">
    <path d="M112 420H400" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18" />
    <circle cx="112" cy="420" r="11" fill="#020814" stroke="#67e8f9" stroke-width="6" />
    <circle cx="256" cy="420" r="11" fill="#67e8f9" />
    <circle cx="400" cy="420" r="11" fill="#020814" stroke="#67e8f9" stroke-width="6" />
  </g>
</svg>
